<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Anki 助手 · 编辑器</title>
<style>
  /* ---------- 皮肤变量：Java 侧 setTheme() 会覆盖这些值 ---------- */
  :root {
    --bg: var(--bg); --card: #ffffff; --panel: var(--panel); --ink: var(--ink);
    --body: var(--body); --sub: var(--sub); --dim: var(--dim);
    --line: var(--line); --line2: var(--line2);
    --accent: var(--accent); --accent-soft: var(--accent-soft); --pressed: var(--pressed);
    --amber: var(--amber); --shadow: var(--shadow);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
                 "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 16px; }
  body { padding-bottom: 14px; }

  /* ---------- 顶部标签 + 工具栏 ---------- */
  /* 两者放进同一个 sticky 容器：以前是两个 sticky 元素用 top:48px 硬拼，
     tab 实际高度一旦不是 48px（不同机型/字号）就会错位，滚动时互相追着重排 → 抖动。
     合成一层 + 提升为合成层（translateZ）后就不抖了。 */
  #topSticky { position: sticky; top: 0; z-index: 30; background: var(--bg);
               -webkit-transform: translateZ(0); transform: translateZ(0);
               -webkit-backface-visibility: hidden; backface-visibility: hidden; }
  /* tab 做成完整圆角的胶囊：之前是"上方圆角 + 无下边框"，下面又不再是白底，
     看起来就像被截断了一半 */
  .tabs { display: flex; gap: 8px;
          padding: 8px 10px 8px 10px; background: var(--bg); }
  .tab { flex: 1; text-align: center; padding: 10px 0; font-size: 15px; font-weight: 600;
         color: var(--sub); background: var(--card); border: 1px solid var(--line);
         border-radius: 12px; }
  .tab.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-soft); }

  /* ---------- 工具栏 ---------- */
  /* 做成和 tab / 字段一样内缩的圆角浮条，而不是通栏白条，否则视觉上很突兀 */
  #toolbar { display: none; overflow-x: auto;
             white-space: nowrap; background: var(--panel); border: 1px solid var(--line);
             border-radius: 12px; padding: 7px 8px; margin: 0 10px 8px 10px; }
  #toolbar::-webkit-scrollbar { display: none; }
  .tb { display: inline-block; min-width: 36px; height: 34px; line-height: 34px; text-align: center;
        padding: 0 8px; margin-right: 2px; font-size: 15px; color: var(--body);
        background: transparent; border: none; border-radius: 8px; vertical-align: middle; }
  .tb:active { background: var(--pressed); }
  .tb.b { font-weight: 800; } .tb.i { font-style: italic; }
  .tb.u { text-decoration: underline; } .tb.s { text-decoration: line-through; }
  .sep { display: inline-block; width: 1px; height: 20px; background: var(--line2);
         margin: 0 7px 0 5px; vertical-align: middle; }

  /* 取色板 */
  #palette { position: fixed; z-index: 40; display: none; background: var(--card); border: 1px solid var(--line);
             border-radius: 10px; padding: 6px; box-shadow: 0 6px 18px var(--shadow); }
  .sw { display: inline-block; width: 26px; height: 26px; border-radius: 6px; margin: 3px; }
  .sw:active { outline: 2px solid var(--accent); }

  /* ---------- 字段 ---------- */
  #editPane { display: block; padding: 2px 10px 4px 10px; }
  .field { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
           margin-bottom: 9px; padding: 8px 12px 10px 12px; }
  .field.focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .fhead { font-size: 12px; color: var(--sub); letter-spacing: .6px; margin-bottom: 4px; }
  .fedit { min-height: 34px; outline: none; font-size: 16px; line-height: 1.55;
           color: var(--ink); word-break: break-word; }
  .fedit:empty:before { content: attr(data-ph); color: var(--dim); }
/* 浏览页只读展示：没有输入框的最小高度，也没有占位符 */
.fedit.ro { min-height: 0; }
.fedit.ro:empty:before { content: none; }
.notemeta { color: #8b98ac; font-size: 12.5px; padding: 2px 0 10px;
  border-bottom: 1px solid #edf1f7; margin-bottom: 14px; }
  textarea.fedit { width: 100%; min-height: 78px; border: none; resize: vertical;
                   font-family: Consolas, Menlo, monospace; font-size: 14px; background: #f8fafc; }
  .htmltag { float: right; font-size: 11px; color: var(--dim); border: 1px solid var(--line);
             border-radius: 6px; padding: 1px 7px; background: var(--card); }
  .htmltag.on { color: var(--accent); border-color: var(--accent-soft); background: var(--accent-soft); }

  /* ---------- 预览 ---------- */
  #prevPane { display: none; padding: 2px 10px 4px 10px; }
  .pbar { display: flex; gap: 10px; margin-bottom: 12px; }
  .pbtn { flex: 1; text-align: center; padding: 11px 0; font-size: 14px; font-weight: 600;
          background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: var(--body); }
  .pbtn:active { background: var(--accent-soft); }
  .pbtn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 预览用的"纸张"外壳；内层 .card 的样式来自 Java 传进来的桌面端模板 CSS，
     所以这里不重复定义 .card —— 预览出来的效果和 Anki 桌面端逐像素一致。 */
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
           padding: 12px; margin-bottom: 10px; overflow-x: auto; }
  .sheet.answer { display: none; }
  .shown .sheet.answer { display: block; }
  .cardlabel { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 6px; }

  /* cloze 与代码块在桌面端模板里没有，这里补上 */
  .card .cloze, .cloze { background: #fff3b0; color: #b45309; font-weight: 600;
                         border-radius: 3px; padding: 0 3px; }
  .card code { background: var(--bg); border-radius: 4px; padding: 1px 5px; }

  /* 预览里的空状态：没输入单词 / 没有内容时给一句人话，而不是空白卡片 */
  .emptyhint { color: var(--dim); font-size: 14px; text-align: center; padding: 22px 6px; }

  /* ---------- 编辑区底部的牌组 / 标签 / 保存（跟着字段一起滚，不固定） ---------- */
  #metaPane { border-top: 1px solid var(--line); margin-top: 14px; padding: 12px 10px 2px 10px; }
  .mrow { display: flex; gap: 10px; }
  .mrow.baseline { align-items: flex-end; }
  .mcol { flex: 1; min-width: 0; }
  .mlabel { font-size: 12px; color: var(--dim); margin-bottom: 5px; }
  .mtxt { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px;
          padding: 10px 12px; font-size: 15px; color: #1e2a3a; background: var(--card); outline: none; }
  .mtxt:focus { border-color: var(--accent-soft); }
  .mrow.actions { margin-top: 12px; }
  .pbtn.small { flex: 0 0 auto; padding: 11px 14px; }
  .pbtn.big { font-size: 15px; padding: 13px 0; }
  .pbtn.off { opacity: .55; }

  /* 窄屏（手机）：牌组/标签/选择按钮一行放不下，会被压成「A Lev」这种截断，
     所以改成竖排——每个输入框独占整行，选择按钮也占整行。 */
  @media (max-width: 640px) {
    .mrow.baseline { flex-direction: column; align-items: stretch; gap: 10px; }
    .pbtn.small { width: 100%; }
  }

  /* 只读模式（浏览卡片详情）：隐藏编辑标签、工具栏与答题条 */
  body.readonly #tabEdit, body.readonly #toolbar, body.readonly #editPane,
  body.readonly .pbar { display: none !important; }
  body.readonly .tabs { display: none; }
  body.readonly #topSticky { display: none; }

  #mjnote { display: none; font-size: 12px; color: var(--amber); padding: 4px 12px; }
</style>

<script>
/* 任何 JS 错误都打到 logcat（Java 侧 onConsoleMessage 会转发），方便真机定位 */
window.onerror = function (msg, src, line, col) {
  try { console.error('JSERROR: ' + msg + ' @' + src + ':' + line + ':' + col); } catch (e) { }
  return false;
};
/* 资源加载失败（脚本/字体）也要能看到 */
document.addEventListener('error', function (e) {
  var t = e.target;
  if (t && (t.src || t.href)) {
    try { console.error('RESERR: ' + (t.src || t.href)); } catch (x) { }
  }
}, true);
</script>
<!-- MathJax 配置必须在脚本之前；与 Anki 一致的定界符：\(..\) 行内、\[..\] 独行 -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)'], ['$', '$']],
      displayMath: [['\\[', '\\]'], ['$$', '$$']],
      processEscapes: true
    },
    options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
    startup: { typeset: false }
  };
</script>
<script src="mathjax/tex-mml-chtml.js" onerror="window.__mjScriptError=true"></script>
<script>
/* MathJax 加载状态自检：Java 侧会调用 mjStatus() 把结果打到日志/状态栏 */
window.__mjScriptError = false;
window.__mjStartup = false;
(function () {
  function watch() {
    if (window.MathJax && MathJax.startup && MathJax.startup.promise) {
      MathJax.startup.promise.then(function () { window.__mjStartup = true; },
                                   function (e) { window.__mjStartupError = String(e); });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', watch);
  } else { watch(); }
})();

function mjStatus() {
  var has = !!window.MathJax;
  var ts = has && (typeof MathJax.typesetPromise === 'function');
  var res = 'n/a', keys = '', st = '';
  try {
    var a = performance.getEntriesByType('resource');
    var o = [];
    for (var i = 0; i < a.length && i < 30; i++) {
      o.push(a[i].name.replace(/^.*\/assets\//, ''));
    }
    res = o.join(' | ');
  } catch (e) { }
  try { keys = Object.keys(window.MathJax || {}).join(','); } catch (e) { }
  try { st = typeof (window.MathJax && window.MathJax.startup); } catch (e) { }
  return {
    scriptLoaded: has,
    scriptError: !!window.__mjScriptError,
    startupDone: !!window.__mjStartup,
    startupError: window.__mjStartupError || '',
    typesetPromise: ts,
    version: has && MathJax.version ? String(MathJax.version) : '',
    startupType: st,
    keys: keys,
    resources: res
  };
}
</script>
</head>

<body>
<div id="topSticky">
<div class="tabs">
  <div class="tab on" id="tabEdit" onclick="setMode('edit')">编辑</div>
  <div class="tab" id="tabPrev" onclick="setMode('preview')">预览</div>
</div>

<div id="toolbar">
  <span class="tb b" onmousedown="return tool(event,'bold')" title="加粗">B</span>
  <span class="tb i" onmousedown="return tool(event,'italic')" title="斜体">I</span>
  <span class="tb u" onmousedown="return tool(event,'underline')" title="下划线">U</span>
  <span class="tb s" onmousedown="return tool(event,'strikeThrough')" title="删除线">S</span>
  <span class="sep"></span>
  <span class="tb" onmousedown="return openPalette(event,'fore')" title="文字颜色">A</span>
  <span class="tb" onmousedown="return openPalette(event,'back')" title="荧光高亮">◑</span>
  <span class="tb" onmousedown="return tool(event,'removeFormat')" title="清除格式">Tx</span>
  <span class="sep"></span>
  <span class="tb" onmousedown="return tool(event,'insertUnorderedList')" title="项目符号">•</span>
  <span class="tb" onmousedown="return tool(event,'insertOrderedList')" title="编号列表">1.</span>
  <span class="tb" onmousedown="return quote(event)" title="引用">❝</span>
  <span class="tb" onmousedown="return codeWrap(event)" title="行内代码">&lt;/&gt;</span>
  <span class="sep"></span>
  <span class="tb" onmousedown="return cloze(event)" title="挖空 {{c1::...}}">{{c}}</span>
  <span class="tb" onmousedown="return tex(event,'inline')" title="行内公式 \\(..\\)">\(..\)</span>
  <span class="tb" onmousedown="return tex(event,'block')" title="独立公式 \\[..\\]">\[..\]</span>
  <span class="sep"></span>
  <span class="tb" onmousedown="return tool(event,'undo')" title="撤销">↶</span>
  <span class="tb" onmousedown="return tool(event,'redo')" title="重做">↷</span>
  <span class="tb" onmousedown="return toggleHtml(event)" title="查看/编辑该字段的 HTML 源码">HTML</span>
</div>
</div><!-- /#topSticky -->

<div id="palette"></div>

<div id="editPane">
  <div class="field" data-f="音标">
    <div class="fhead">音标 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="英 /…/；美 /…/"></div>
  </div>
  <div class="field" data-f="词性">
    <div class="fhead">词性 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="n / adj / v（多个用 / 连接）"></div>
  </div>
  <div class="field" data-f="定义">
    <div class="fhead">定义 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="(n) 英文释义; (v) 另一个义项"></div>
  </div>
  <div class="field" data-f="关联公式/符号">
    <div class="fhead">关联公式 / 符号 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="行内 MathJax，写成 \( … \)"></div>
  </div>
  <div class="field" data-f="易混">
    <div class="fhead">易混 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="每行一个：词 /音标/ 词性 中文释义"></div>
  </div>
  <div class="field" data-f="中文">
    <div class="fhead">中文 <span class="htmltag" onclick="toggleHtmlFor(this)">HTML</span></div>
    <div class="fedit" contenteditable="true" data-ph="多个义项用「；」分隔"></div>
  </div>

  <!-- 牌组 / 标签 / 保存：就在编辑区内，跟字段一起滚动（不再单独占一块固定面板） -->
  <div id="metaPane">
    <div class="mrow baseline">
      <div class="mcol">
        <div class="mlabel">牌组</div>
        <input type="text" id="deckInput" class="mtxt" spellcheck="false" autocomplete="off"
               placeholder="A Level Pure Mathematics">
      </div>
      <div class="pbtn small" id="btnPick" onclick="pickDeck()">▾ 选择牌组</div>
      <div class="mcol">
        <div class="mlabel">标签（随牌组自动填充）</div>
        <input type="text" id="tagInput" class="mtxt" spellcheck="false" autocomplete="off"
               placeholder="ALevel::Maths">
      </div>
    </div>
    <div class="mrow actions">
      <div class="pbtn primary big" id="btnSave" onclick="doSave(false)">保存到 Anki</div>
      <div class="pbtn big" id="btnDraft" onclick="doSave(true)">存草稿</div>
    </div>
  </div>
</div>

<div id="prevPane">
  <div class="pbar">
    <div class="pbtn primary" id="btnAnswer" onclick="toggleAnswer()">显示答案</div>
  </div>
  <div id="mjnote">公式渲染组件未加载（离线？），公式以源码显示</div>
  <div class="sheet" id="cardFront"><div class="cardlabel">正面</div><div class="card"><div class="cbody"></div></div></div>
  <div class="sheet answer" id="cardBack"><div class="cardlabel">背面</div><div class="card"><div class="cbody"></div></div></div>
</div>

<script>
/* ======================================================================
 * Anki 助手编辑器
 * - 编辑：字段 contenteditable + 工具栏（Anki 里能做的事这里都能做）
 * - 预览：直接跑真正的卡片模板（Java 传进来的模板/样式 = 桌面端那份）
 * - 全部 ES5，不使用箭头函数/let/const（老 WebView 也能跑）
 * Java 通过 evaluateJavascript 调这里的全局函数。
 * ====================================================================== */

var A = {
  word: '',
  fields: {},
  templates: { front: '', back: '', css: '' },
  mode: 'edit',
  answers: false,
  active: null,     // 当前聚焦的字段 div
  htmlMode: null,   // 处于 HTML 源码模式的字段
  mjTries: 0
};

function $(id) { return document.getElementById(id); }
function fields_() { return document.querySelectorAll('#editPane .field'); }

/* ---------------- 模式切换 ---------------- */
function setMode(m) {
  A.mode = (m === 'preview') ? 'preview' : 'edit';
  $('tabEdit').className = 'tab' + (A.mode === 'edit' ? ' on' : '');
  $('tabPrev').className = 'tab' + (A.mode === 'preview' ? ' on' : '');
  $('editPane').style.display = A.mode === 'edit' ? 'block' : 'none';
  $('prevPane').style.display = A.mode === 'preview' ? 'block' : 'none';
  $('toolbar').style.display = A.mode === 'edit' ? 'block' : 'none';
  if (A.mode === 'preview') refreshPreview();
}

function toggleAnswer() {
  A.answers = !A.answers;
  document.body.classList.toggle('shown', A.answers);
  $('btnAnswer').textContent = A.answers ? '隐藏答案' : '显示答案';
}

/* ---------------- 牌组 / 标签 / 保存（在编辑区内，随字段滚动） ---------------- */

function setMeta(deck, tags) {
  var d = $('deckInput'), t = $('tagInput');
  if (d) d.value = (deck === null || deck === undefined) ? '' : String(deck);
  if (t) t.value = (tags === null || tags === undefined) ? '' : String(tags);
  applyDeckTag();
}

/** Java 选完牌组后回填 */
function setDeck(deck) {
  var d = $('deckInput');
  if (!d) return;
  d.value = (deck === null || deck === undefined) ? '' : String(deck);
  applyDeckTag();
}

/** 牌组 → 标签：映射表在 Java 的 CardFormat.tagsForDeck 里（单一来源） */
function applyDeckTag() {
  var d = $('deckInput'), t = $('tagInput');
  if (!d || !t) return;
  var tag = '';
  try { if (window.Android && Android.tagForDeck) tag = Android.tagForDeck(d.value) || ''; } catch (e) { }
  if (tag && t.value !== tag) t.value = tag;
}

function pickDeck() {
  try { if (window.Android) Android.pickDeck(); } catch (e) { }
}

function doSave(draft) {
  var d = $('deckInput'), t = $('tagInput');
  var deck = d ? d.value : '', tags = t ? t.value : '';
  try {
    if (!window.Android) return;
    if (draft) Android.saveDraft(deck, tags); else Android.saveNote(deck, tags);
  } catch (e) { }
}

/** 保存过程中禁用按钮，避免重复提交 */
function setSaving(on) {
  var ids = ['btnSave', 'btnDraft', 'btnPick'];
  for (var i = 0; i < ids.length; i++) {
    var el = $(ids[i]);
    if (el) el.className = (i === 0 ? 'pbtn primary big' : (i === 2 ? 'pbtn small' : 'pbtn big'))
        + (on ? ' off' : '');
  }
}

(function () {
  var d = $('deckInput');
  if (d) d.addEventListener('input', applyDeckTag);
})();

/* ---------------- Java 调用入口 ---------------- */
function setWord(w) {
  A.word = (w === null || w === undefined) ? '' : String(w);
  if (A.mode === 'preview') refreshPreview();
}

function setFields(obj) {
  A.fields = obj || {};
  var fs = fields_();
  for (var i = 0; i < fs.length; i++) {
    var name = fs[i].getAttribute('data-f');
    var ed = fs[i].querySelector('.fedit');
    if (ed && ed.tagName === 'DIV') ed.innerHTML = A.fields[name] || '';
    else if (ed) ed.value = A.fields[name] || '';
  }
  if (A.mode === 'preview') refreshPreview();
}

/* 按当前 config 重建编辑区的字段框（第一个字段是正面=单词，不在这里显示） */
function applyConfig(cfg) {
  if (!cfg || !cfg.fields) return;
  var old = {};
  var fs = fields_();
  for (var i = 0; i < fs.length; i++) {
    var n = fs[i].getAttribute('data-f');
    var ed = fs[i].querySelector('.fedit');
    if (ed) old[n] = (ed.tagName === 'TEXTAREA') ? ed.value : ed.innerHTML;
  }
  var pane = document.getElementById('editPane');
  for (var j = fs.length - 1; j >= 0; j--) pane.removeChild(fs[j]);
  var meta = document.getElementById('metaPane');
  var made = [];
  for (var k = 0; k < cfg.fields.length; k++) {
    var f = cfg.fields[k];
    if (f.front) continue;                    /* 正面由上面的单词框负责 */
    var box = document.createElement('div');
    box.className = 'field';
    box.setAttribute('data-f', f.name);
    var head = document.createElement('div');
    head.className = 'fhead';
    head.appendChild(document.createTextNode(f.name + ' '));
    var tag = document.createElement('span');
    tag.className = 'htmltag';
    tag.textContent = 'HTML';
    tag.onclick = function () { toggleHtmlFor(this); };
    head.appendChild(tag);
    box.appendChild(head);
    var edit = document.createElement('div');
    edit.className = 'fedit';
    edit.setAttribute('contenteditable', 'true');
    if (f.hint) edit.setAttribute('data-ph', f.hint);
    box.appendChild(edit);
    pane.insertBefore(box, meta);
    made.push(box);
  }
  A.configName = cfg.name || '';
  var keep = {};
  for (var m = 0; m < made.length; m++) {
    var nm = made[m].getAttribute('data-f');
    keep[nm] = old[nm] || '';
  }
  A.fields = keep;
  setFields(keep);
}

function getFields() {
  var out = {};
  var fs = fields_();
  for (var i = 0; i < fs.length; i++) {
    var name = fs[i].getAttribute('data-f');
    var ed = fs[i].querySelector('.fedit');
    if (!ed) { out[name] = A.fields[name] || ''; continue; }
    out[name] = (ed.tagName === 'TEXTAREA') ? ed.value : ed.innerHTML;
  }
  A.fields = out;
  return out;
}

function clearFields() {
  setFields({});
  setWord('');
  A.answers = false;
  document.body.classList.remove('shown');
  if ($('btnAnswer')) $('btnAnswer').textContent = '显示答案';
}

function setTemplates(t) {
  if (!t) return;
  A.templates = t;
  if (A.mode === 'preview') refreshPreview();
}

/** 只读展示一张卡片（浏览页用） */
function showCard(fields) {
  document.body.classList.add('readonly');
  A.fields = fields || {};
  A.word = A.fields['单词'] || '';
  A.answers = true;
  document.body.classList.add('shown');
  setMode('preview');
}

function setAnswerShown(v) {
  A.answers = !!v;
  document.body.classList.toggle('shown', A.answers);
  if ($('btnAnswer')) $('btnAnswer').textContent = A.answers ? '隐藏答案' : '显示答案';
}

/* ---------------- Anki 模板引擎 ---------------- */
function fieldVal(f, name) {
  var v = f[name];
  return (v === null || v === undefined) ? '' : String(v);
}

function renderCloze(html) {
  // {{c1::文本}} / {{c1::文本::提示}} -> 高亮（预览里答案始终可见）
  return String(html)
    .replace(/\{\{c(\d+)::([\s\S]*?)(?:::[^\}]*)?\}\}/g, '<span class="cloze">$2</span>');
}

function renderTemplate(tpl, f) {
  if (!tpl) return '';
  var out = tpl;
  // 条件块 {{#字段}}...{{/字段}} 与 {{^字段}}...{{/字段}}（允许一层嵌套同名）
  var guard = 0;
  while (guard++ < 20 && /\{\{[#^][\s\S]+?\}\}[\s\S]*?\{\{\/[\s\S]+?\}\}/.test(out)) {
    out = out.replace(/\{\{#([\s\S]+?)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function (m, name, body) {
      return fieldVal(f, name).length ? renderTemplate(body, f) : '';
    });
    out = out.replace(/\{\{\^([\s\S]+?)\}\}([\s\S]*?)\{\{\/\1\}\}/g, function (m, name, body) {
      return fieldVal(f, name).length ? '' : renderTemplate(body, f);
    });
    if (guard > 15) break;
  }
  // 普通字段 {{字段}}（保留 HTML，做 cloze 渲染）
  out = out.replace(/\{\{(cloze:)?([\s\S]+?)\}\}/g, function (m, cloze, name) {
    var v = fieldVal(f, name);
    if (!v) return '';
    return renderCloze(v);
  });
  return out;
}

function applyCardCss() {
  var st = document.getElementById('cardcss');
  if (!st) {
    st = document.createElement('style');
    st.id = 'cardcss';
    document.head.appendChild(st);
  }
  st.textContent = A.templates.css || '';
}

function refreshPreview() {
  applyCardCss();
  var f = {};
  var hasContent = false;
  for (var k in A.fields) {
    if (A.fields.hasOwnProperty(k)) {
      f[k] = A.fields[k];
      if (plain(A.fields[k]).length) hasContent = true;
    }
  }
  f['单词'] = A.word;
  if (plain(A.word).length) hasContent = true;
  var front = renderTemplate(A.templates.front, f);
  var back = renderTemplate(A.templates.back, f);
  // 空状态：给一句人话，别让用户对着一张什么都没有的卡片猜
  if (!plain(A.word).length) {
    front = '<div class="emptyhint">还没有输入单词</div>';
  } else if (!plain(front).length) {
    front = '<div class="word">' + escapeHtml(A.word) + '</div>';
  }
  if (!hasContent || !plain(back).length) {
    back = '<div class="emptyhint">还没有内容<br>点上方「AI 填充」自动生成，或切到「编辑」自己写</div>';
  }
  $('cardFront').querySelector('.cbody').innerHTML = front;
  $('cardBack').querySelector('.cbody').innerHTML = back;
  document.body.classList.toggle('shown', A.answers);
  typeset($('cardFront'));
  typeset($('cardBack'));
}

/** 去掉标签后还剩多少可见文字（判断"这个字段到底有没有内容"） */
function plain(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/<br\s*\/?>/gi, ' ')
    .replace(/<[^>]*>/g, '')
    .replace(/&nbsp;/g, ' ')
    .replace(/\s+/g, '')
    .trim();
}

function escapeHtml(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ---------------- MathJax ---------------- */
function typeset(el) {
  if (!el) return;
  if (window.MathJax && MathJax.typesetPromise) {
    try {
      if (MathJax.typesetClear) MathJax.typesetClear([el]);
      MathJax.typesetPromise([el]).then(null, function () { });
    } catch (e) { }
    return;
  }
  // MathJax 还在加载：重试若干次，实在没有就提示"公式以源码显示"
  if (A.mjTries < 30) {
    A.mjTries++;
    setTimeout(function () { typeset(el); }, 300);
  } else {
    var n = $('mjnote');
    if (n) n.style.display = 'block';
  }
}

/* ---------------- 浏览页：只读展示一条笔记（复用同一套样式与 MathJax） ---------------- */

function showNoteFields(payload) {
  var pane = $('editPane');
  if (!pane) return;
  var stick = $('topSticky'); if (stick) stick.style.display = 'none';
  var meta = $('metaPane'); if (meta) meta.style.display = 'none';
  var prev = $('prevPane'); if (prev) prev.style.display = 'none';
  pane.innerHTML = '';

  if (payload && (payload.model || payload.tags)) {
    var info = document.createElement('div');
    info.className = 'notemeta';
    info.textContent = (payload.model || '') + (payload.tags ? '　·　' + payload.tags : '');
    pane.appendChild(info);
  }

  var list = (payload && payload.fields) ? payload.fields : [];
  for (var i = 0; i < list.length; i++) {
    var f = list[i];
    if (!f || !f.value) continue;              /* 空字段不显示 */
    var box = document.createElement('div');
    box.className = 'field';
    var head = document.createElement('div');
    head.className = 'fhead';
    head.textContent = f.name;
    box.appendChild(head);
    var val = document.createElement('div');
    val.className = 'fedit ro';
    val.innerHTML = f.value;                   /* 字段本身就是 HTML，交给 MathJax 处理公式 */
    box.appendChild(val);
    pane.appendChild(box);
  }
  typeset(pane);
  window.scrollTo(0, 0);
}

/* 皮肤：Java 侧在建好页面后调用，传入当前主题的取色 */
function setTheme(t) {
  if (!t) return;
  var r = document.documentElement.style;
  var map = {
    '--bg': t.bg, '--card': t.card, '--panel': t.panel, '--ink': t.ink,
    '--body': t.body, '--sub': t.sub, '--dim': t.dim,
    '--line': t.line, '--line2': t.line, '--accent': t.accent,
    '--accent-soft': t.accentSoft, '--pressed': t.accentSoft,
    '--amber': t.amber, '--shadow': t.shadow
  };
  for (var k in map) {
    if (map[k]) r.setProperty(k, map[k]);
  }
}

/* ---------------- 工具栏 ---------------- */
function focusedField() {
  var el = document.activeElement;
  while (el && el !== document.body) {
    if (el.className && String(el.className).indexOf('fedit') >= 0) return el;
    el = el.parentNode;
  }
  return A.active;
}

function tool(ev, cmd) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  var ed = focusedField();
  if (ed && ed.tagName === 'TEXTAREA') return false;
  if (ed) ed.focus();
  try { document.execCommand(cmd, false, null); } catch (e) { }
  syncAfter();
  return false;
}

function quote(ev) {
  if (ev) { ev.preventDefault(); }
  var ed = focusedField(); if (ed) ed.focus();
  try { document.execCommand('formatBlock', false, 'blockquote'); } catch (e) { }
  syncAfter();
  return false;
}

function codeWrap(ev) {
  if (ev) { ev.preventDefault(); }
  wrapSelection('<code>', '</code>', '代码');
  return false;
}

function cloze(ev) {
  if (ev) { ev.preventDefault(); }
  wrapSelection('{{c1::', '}}', '文字');
  return false;
}

function tex(ev, kind) {
  if (ev) { ev.preventDefault(); }
  if (kind === 'block') wrapSelection('\\[', '\\]', '公式');
  else wrapSelection('\\(', '\\)', '公式');
  return false;
}

/** 把选中内容包起来；没有选中就插入占位文字并选中它（方便直接打字替换） */
function wrapSelection(before, after, placeholder) {
  var ed = focusedField();
  if (!ed) return;
  if (ed.tagName === 'TEXTAREA') { ed.focus(); return; }
  ed.focus();
  var sel = window.getSelection();
  var text = '';
  if (sel && sel.rangeCount > 0) text = String(sel.toString());
  var html = escapeHtml(text.length ? text : placeholder);
  try { document.execCommand('insertHTML', false, before + html + after); } catch (e) { }
  if (!text.length) selectLastOccurrence(placeholder);
  syncAfter();
}

function selectLastOccurrence(needle) {
  try {
    var root = focusedField();
    if (!root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
    var node = null, hit = null;
    while ((node = walker.nextNode())) {
      if (node.nodeValue.indexOf(needle) >= 0) hit = node;
    }
    if (!hit) return;
    var i = hit.nodeValue.lastIndexOf(needle);
    var r = document.createRange();
    r.setStart(hit, i);
    r.setEnd(hit, i + needle.length);
    var s = window.getSelection();
    s.removeAllRanges();
    s.addRange(r);
  } catch (e) { }
}

function undo(ev) { return tool(ev, 'undo'); }
function redo(ev) { return tool(ev, 'redo'); }

/* ---------------- 取色板 ---------------- */
var COLORS = ['var(--ink)', 'var(--accent)', '#21a366', 'var(--amber)', '#e0533f',
              '#7c3aed', '#0891b2', '#be185d', 'var(--dim)', '#ffffff'];
var HL = ['#fff3b0', '#d9f7e8', '#dbeafe', '#ffe4e1', '#ede9fe', 'var(--bg)'];

function openPalette(ev, which) {
  if (ev) { ev.preventDefault(); ev.stopPropagation(); }
  var p = $('palette');
  var list = which === 'back' ? HL : COLORS;
  var html = '';
  for (var i = 0; i < list.length; i++) {
    html += '<span class="sw" style="background:' + list[i] +
            (list[i] === '#ffffff' ? ';border:1px solid var(--line)' : '') +
            '" onmousedown="return pickColor(event,\'' + which + '\',\'' + list[i] + '\')"></span>';
  }
  p.innerHTML = html;
  p.style.display = 'block';
  var r = (ev && ev.target && ev.target.getBoundingClientRect) ? ev.target.getBoundingClientRect() : null;
  p.style.left = (r ? Math.max(6, Math.min(r.left, window.innerWidth - 260)) : 20) + 'px';
  p.style.top = ((r ? r.bottom + 6 : 60)) + 'px';
  return false;
}

function pickColor(ev, which, color) {
  if (ev) { ev.preventDefault(); }
  $('palette').style.display = 'none';
  var ed = focusedField(); if (ed) ed.focus();
  try {
    if (which === 'back') {
      if (!document.execCommand('hiliteColor', false, color)) {
        document.execCommand('backColor', false, color);
      }
    } else {
      document.execCommand('foreColor', false, color);
    }
  } catch (e) { }
  syncAfter();
  return false;
}

/* ---------------- HTML 源码模式 ---------------- */
function toggleHtmlFor(tagEl) {
  var field = tagEl.parentNode.parentNode;   // .fhead 的父级 .field
  switchHtml(field);
}

function toggleHtml(ev) {
  if (ev) { ev.preventDefault(); }
  var ed = focusedField();
  if (!ed) return false;
  var field = ed.parentNode;
  switchHtml(field);
  return false;
}

function switchHtml(field) {
  var ed = field.querySelector('.fedit');
  var tag = field.querySelector('.htmltag');
  if (!ed) return;
  if (ed.tagName === 'DIV') {
    var ta = document.createElement('textarea');
    ta.className = 'fedit';
    ta.value = ed.innerHTML;
    ed.parentNode.replaceChild(ta, ed);
    ta.focus();
    if (tag) tag.classList.add('on');
  } else {
    var dv = document.createElement('div');
    dv.className = 'fedit';
    dv.setAttribute('contenteditable', 'true');
    dv.innerHTML = taValue(ed);
    ed.parentNode.replaceChild(dv, ed);
    if (tag) tag.classList.remove('on');
    A.active = dv;
  }
  syncAfter();
}

function taValue(ta) {
  // 源码里可能被用户改坏：容错解析，实在不行原样转义
  try {
    var d = document.createElement('div');
    d.innerHTML = ta.value;
    return d.innerHTML;
  } catch (e) {
    return escapeHtml(ta.value);
  }
}

/* ---------------- 事件 ---------------- */
function syncAfter() {
  // 字段变化即时同步到内部状态（预览时用）
  A.fields = getFields();
}

function init() {
  var fs = fields_();
  for (var i = 0; i < fs.length; i++) {
    (function (field) {
      var ed = field.querySelector('.fedit');
      if (!ed) return;
      ed.addEventListener('focus', function () {
        A.active = ed;
        field.classList.add('focus');
        $('toolbar').style.display = A.mode === 'edit' ? 'block' : 'none';
      });
      ed.addEventListener('blur', function () { field.classList.remove('focus'); });
      ed.addEventListener('input', function () { A.fields = getFields(); });
    })(fs[i]);
  }
  document.addEventListener('mousedown', function (e) {
    var p = $('palette');
    if (p && p.style.display === 'block') {
      var t = e.target;
      while (t) { if (t === p) return; t = t.parentNode; }
      p.style.display = 'none';
    }
  });
  // 页面里点一下就把工具栏显出来（进入编辑页时）
  $('toolbar').style.display = 'block';
  setMode('edit');
  A.ready = true;
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { init(); });
} else {
  init();
}
</script>
